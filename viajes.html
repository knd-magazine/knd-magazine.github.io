<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diarios de viaje</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 30px;
      line-height: 1;
      background-color: white;
      color: black;
    }
.barra-superior {
  width: 100%;
  height: 70px;
  background-color: #e0e0e0;   /* gris clásico */
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-sizing: border-box;

  padding: 6px 10px;           /* espacio entre contenido y marco */

  border: 2px solid black;     /* marco interior */
  outline: 2px solid black;    /* marco exterior */
  outline-offset: -4px;        /* líneas juntas estilo Windows antiguo */
}
    .barra-superior .icono-casa {
      width: 45px;
      height: 45px;
      background-image: url('icono-casa.svg');
      background-size: contain;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .barra-superior .titulo-seccion {
      flex-grow: 1;
      text-align: center;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .barra-superior .pagina {
      width: 100px;
      text-align: right;
    }
    .barra-secundaria {
      width: 100%;
      display: flex;
      box-sizing: border-box;
      padding: 0 10px;
      margin-top: 5px;
      border-bottom: 1px solid #ccc;
    }
    .columna-autor {
      width: 45%;
      font-weight: bold;
      text-decoration: underline;
    }
    .columna-titulo {
      width: 55%;
      font-weight: bold;
      text-decoration: underline;
      text-align: right;
    }
    .lista {
      margin-top: 10px;
      padding: 0 10px;
    }
    .fila {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }
    .fila .autor {
      width: 45%;
    }
.fila .articulo {
  width: 60%;
  text-align: right;
  text-decoration: none;
  color: white;              /* letras blancas */
  background-color: black;   /* fondo negro */
  padding: 2px 6px;
}

    .fila .articulo:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="barra-superior">
    <a href="index.html">
    </a>
<a href="index.html" id="home-btn" title="Inicio">&#8962;</a>
    <div class="titulo-seccion">Diarios de Viaje</div>
  </div>

  <div class="barra-secundaria">
    <div class="columna-autor">Autor:</div>
    <div class="columna-titulo">Colección:</div>
  </div>

  <div class="lista">
    <!-- Ejemplo de filas. Copia hasta 32; si sobra, crea resenas2.html y ajusta indicadores -->
    <div class="fila">
      <div class="autor">Picher</div>
      <a href="sudestecompleto.html" class="articulo">Viajes por el sudeste asiático</a>
    </div>
    <div class="fila">

    </div>
    <!-- Continúa agregando filas hasta 32 líneas -->
  </div>
</body>
</html>
