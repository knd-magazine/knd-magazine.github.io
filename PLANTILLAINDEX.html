<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>INSERTA EL NOMBRE DE TU WEB</title>
  <style>
    /* Estilos generales para Kindle 10.ª generación con Arial 30 px */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 30px;        
      line-height: 1;         
      background-color: white;
      color: black;
    }
    /* Barra superior fija en la parte superior de la pantalla */
    .barra-superior {
      width: 100%;
      height: 70px;          
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 0 10px;
      border-bottom: 1px solid #ccc;
    }
    .barra-superior .titulo-sitio {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Contenedor de categorías desplazado hacia abajo para dejar espacio a la barra */
    .contenedor {
      width: 100%;
      height: calc(100vh - 70px); /* Resta 70px de la barra superior */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding-left: 20px;       
      box-sizing: border-box;
    }
    .categoria {
      margin-bottom: 20px;      
      text-decoration: none;
      color: black;
    }
    .categoria:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Barra superior con el nombre del sitio -->
  <div class="barra-superior">
    <div class="titulo-sitio">KND-Magazine</div>
  </div>
  <!-- Contenedor con las secciones -->
  <div class="contenedor">

    </div>
    </body>
</html>
