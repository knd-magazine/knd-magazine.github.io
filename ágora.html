  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      font-size: 27px;
      line-height: 1.0; /* interlineado 1.0 */
    }
    #container {
      position: relative;
      width: 100%;
      height: 100vh;          /* ocupa toda la pantalla */
      display: flex;
      flex-direction: column; /* header + content */
    }
    /* ===== Barra superior ===== */
    #header {
      flex: 0 0 50px;         /* altura fija 50px */
      border-bottom: 1px solid #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: #fff;
      z-index: 5;
    }
    #back-btn {
      cursor: pointer;
      font-size: 1.8rem;
      user-select: none;
      margin-right: 10px;
    }
    #title {
      flex: 1;
      text-align: center;
      font-weight: bold;
    }
    #page-indicator {
      font-size: 0.95rem;
      margin-left: 10px;
    }
    /* ===== Zona de contenido ===== */
    #content {
      flex: 1;
      position: relative;
      padding: 10px 40px; /* 10px arriba/abajo, 40px izquierda/derecha */
      overflow: hidden;   /* sin scroll vertical */
    }
    .page {
      display: none;
      width: 100%;
      height: 100%;
    }
    .page.active {
      display: block;
    }
    .page p {
      text-align: justify;
      margin-bottom: 0.5em;
    }
    .page h2 {
      font-size: 30px;          /* igual que el resto del texto */
      font-weight: bold;
      text-decoration: underline;
      margin-bottom: 0.5em;
      text-align: left;
    }
    /* ===== Botones laterales (fondo negro, triángulo blanco) ===== */
    .button-prev,
    .button-next {
      position: absolute;
      top: calc(50%);
      transform: translateY(-50%);
      width: 35px;
      height: 70px;
      background: #000;       /* fondo negro */
      color: #fff;            /* triángulo blanco */
      font-size: 2.5rem;
      line-height: 70px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      border: none;
      z-index: 2;
    }
    .button-prev { left: 5px; }
    .button-next { right: 5px; }
  </style>
</head>
<body>
  <div id="container">
    <!-- Barra superior -->
    <div id="header">
    <a href="index.html" id="home-btn" title="Inicio">&#8962;</a>&nbsp;
      <a href="columnas.html" id="home-btn" title="Índice">&#9776;</a>

      <span id="page-indicator">1 de 1</span>
    </div>

    <!-- Zona de contenido -->
    <div id="content">
      <!-- Página 0: Portada fija -->
      <div class="page" id="page-0">
        <div id="cover">
          <h1 style="font-size:1.0rem; text-align:center; margin-bottom:15px;">
          </h1>
          <p style="text-align:justify; line-height:1.0;">
            Agora, una red social especulativa.<br>
          </p>
        </div>
      </div>
      <!-- Las demás páginas se crearán dinámicamente -->
    </div>

    <!-- Botones laterales -->
    <div class="button-prev" id="btn-prev">&#x25C0;</div>
    <div class="button-next" id="btn-next">&#x25B6;</div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Texto completo con subtítulos incluidos
      var textoCompleto =
﻿`<b>Ágora: la red social que se rehúsa al algoritmo, revive el texto y llega con su propio dispositivo de tinta electrónica</b>
<p>En un mundo saturado de notificaciones, scroll infinito, métricas de vanidad y ruido digital, Ágora se presenta como un proyecto radical: una red social construida desde cero para ser lo opuesto de lo que hoy entendemos como red social. Y lo hace no sólo con una propuesta de plataforma minimalista y pensada para el pensamiento pausado, sino también con un hardware propio: un dispositivo de tinta electrónica que recuerda al iPod, no por nostalgia, sino por coherencia.</p>
<b>Una red que limita para pensar</b>
En Ágora no hay “me gusta” inmediatos, ni comentarios impulsivos. Para interactuar con una publicación, primero hay que leerla entera. El sistema detecta el tiempo de lectura estimado y no habilita reacciones hasta que se haya cumplido. El contenido debe tener al menos 200 palabras para ser publicado, y los usuarios sólo pueden subir una entrada por día. La idea es simple, pero poderosa: obligar a desacelerar.
Cada usuario tiene un límite diario de 20 comentarios, y sólo puede comentar una vez por publicación. El autor tiene control para eliminar respuestas demasiado breves, permitiendo así una discusión más reflexiva y menos tóxica. En Ágora, el debate no se convierte en guerra: no hay hilos interminables ni notificaciones que alimenten la ansiedad.
<b>  No hay trending topics, sólo ideas</b>
El contenido se organiza cronológicamente, sin jerarquías de popularidad. Existen tres formas de navegación: publicaciones recientes, autores seguidos y etiquetas. Estas últimas se generan libremente por los usuarios y se agrupan visualmente al estilo Mentimeter. Además, cada mes se publican dosieres temáticos que agrupan las entradas más relevantes bajo etiquetas específicas. Estos documentos, de descarga gratuita para los miembros, pueden también adquirirse por 5 dólares si no se tiene cuenta.
<b>Sin algoritmos ni monetización de datos</b>
Aquí no hay feeds manipulados por IA ni venta de información personal. Los perfiles son públicos, pero no muestran seguidores ni ranking de popularidad. La visibilidad se gana por la calidad del texto, no por métricas externas. Cada usuario puede acceder a sus métricas personales, y si lo desea, descargar un informe completo con estadísticas de lectura, artículos escritos y tiempo de permanencia, útil incluso para su currículum. Eso sí, cuesta 10 dólares.
La plataforma se financia mediante una suscripción mínima de 1 dólar mensual. Quienes se unan durante la fase beta, sin embargo, conservarán el acceso gratuito de por vida. También se admite la figura del "mecenazgo de marca": perfiles corporativos que no pueden hacer publicidad directa, pero sí publicar contenido original o auspiciar dosieres y etiquetas.
<b>Un dispositivo dedicado: tinta electrónica, teclado opcional y sin scroll</b>
Pero lo que realmente diferencia a Ágora de cualquier otra red social es su dispositivo. Se trata de un lector de tinta electrónica, del tamaño de un bolsillo, que permite navegar por la plataforma y realizar comentarios breves mediante un teclado en pantalla. El scroll se reemplaza por botones físicos de paso lateral: cada bloque de texto se carga de forma secuencial, como páginas de un libro.
La escritura larga, en cambio, está pensada para hacerse desde el sitio web o mediante teclado bluetooth. El dispositivo no está diseñado para responder de inmediato, sino para leer con calma y pensar antes de escribir.
<b>Tienda de libros integrada</b>
El gadget de Ágora no es solo un terminal para la red: incluye también una tienda de libros electrónicos. Con licencias de distribución similares a las de Amazon o Rakuten, los usuarios podrán comprar obras contemporáneas o acceder libremente a una biblioteca de dominio público. Las ganancias de esta tienda también ayudarán a mantener el proyecto sin recurrir a anuncios invasivos ni recolección de datos.
<b>Comprar el dispositivo = membresía de por vida</b>
Quienes adquieran el dispositivo obtienen acceso gratuito y permanente a la plataforma. Es una forma de integrar el software y el hardware en un mismo ecosistema, recuperando esa lógica que en su día popularizaron el iPod y iTunes: el aparato no como un terminal universal, sino como un medio específico para una experiencia específica.
<b>Una red que no quiere crecer rápido, sino durar</b>
Ágora no busca conquistar el mercado de inmediato. No tiene inversores de capital de riesgo, ni promete ser la "próxima revolución" de Silicon Valley. En su lugar, propone un gesto político y cultural: repensar qué significa comunicarse en tiempos de sobrecarga, y devolverle al texto —y al pensamiento— su lugar.
La filosofía que la inspira no es la del crecimiento exponencial, sino la de la conversación significativa. Tal vez no sea para todos, pero es precisamente esa exclusión voluntaria la que le da sentido. En Ágora no hay viralidad, hay permanencia.
Y eso, en estos tiempos, ya es revolucionario.`;
      // Parámetros para Kindle 10ª generación (800×600 px, Arial 30px, line-height 1.0)
      var anchoDisponible   = 600 - (40 + 40); // 600px ancho − 40px padding izq − 40px padding der
      var anchoChar         = 15;             // aprox ancho medio de un carácter en Arial 30px
      var charsPorLinea     = Math.floor(anchoDisponible / anchoChar); // ≈ 34
      var altoDisponible    = 1700; // 800px alto − header(50) − footer eliminado − padding vert(10+10) = 690
      var lineHeight        = 70;             // 30px por línea (font-size × line-height)
      // Restamos 6.2 líneas para dejar 17 líneas útiles (23 − 6.2 ≈ 16.8 → 16 o 17)
      var lineasPorPagina   = Math.floor(altoDisponible / lineHeight +0); // aprox 16
      var maxCharsPorPagina = charsPorLinea * lineasPorPagina;                // ≈ 34 × 16 = 544

      // Función para dividir texto sin cortar palabras
      function dividirEnPaginas(texto, maxChars) {
        var paginas = [];
        var indice = 0;
        while (indice < texto.length) {
          var trozo = texto.substr(indice, maxChars);
          if (indice + maxChars >= texto.length) {
            paginas.push(texto.substr(indice).trim());
            break;
          }
          // Buscar el último espacio antes de maxChars
          var ultimoEspacio = trozo.lastIndexOf(' ');
          if (ultimoEspacio === -1) {
            ultimoEspacio = maxChars;
          }
          paginas.push(texto.substr(indice, ultimoEspacio).trim());
          indice += ultimoEspacio;
          // Saltar espacios adicionales
          while (texto.charAt(indice) === ' ') {
            indice++;
          }
        }
        return paginas;
      }

      // Obtener array de páginas según máximo de caracteres
      var paginasText = dividirEnPaginas(textoCompleto, maxCharsPorPagina);

      // Insertar cada página en #content (dentro de un <p>, con saltos de línea)
      var contentDiv = document.getElementById('content');
      paginasText.forEach(function(trozo, i) {
        var paginaDiv = document.createElement('div');
        paginaDiv.className = 'page';
        // Reconvertir saltos de línea dobles en <br><br>, simples en <br>
        var htmlPagina = trozo
          .replace(/\n\s*\n/g, '<br><br>') // dobles saltos → doble <br>
          .replace(/\n/g, '<br>');          // saltos simples → <br>
        // Dentro del trozo pueden haber subtítulos: buscamos líneas que empiecen con "1 –", "2 –", etc.
        // Si detectamos un subtítulo, lo metemos en <h2> y el resto en <p>
        var fragmentos = htmlPagina.split(/<br><br>/g);
        fragmentos.forEach(function(frag, idx) {
          // Si una línea comienza con dígito + espacio + '–', lo tratamos como subtítulo
          var matchSub = frag.match(/^(\d+\s*–\s*[^<]+)/);
          if (matchSub) {
            var h2 = document.createElement('h2');
            h2.textContent = matchSub[1].trim();
            paginaDiv.appendChild(h2);
            // Si hay texto a continuación en la misma línea, lo ponemos en un <p> separado
            var resto = frag.substr(matchSub[1].length).trim();
            if (resto) {
              var p2 = document.createElement('p');
              p2.innerHTML = resto;
              paginaDiv.appendChild(p2);
            }
          } else {
            var p = document.createElement('p');
            p.innerHTML = frag;
            paginaDiv.appendChild(p);
          }
        });
        contentDiv.appendChild(paginaDiv);
      });

      // Marcar IDs y mostrar la primera página
      var pageElements = Array.prototype.slice.call(document.querySelectorAll('.page'));
      var totalPages = pageElements.length;
      pageElements.forEach(function(pg, idx) {
        pg.id = 'page-' + idx;
      });

      var indicator = document.getElementById('page-indicator');
      indicator.textContent = '1 de ' + totalPages;
      pageElements[0].classList.add('active');

      // Configurar botones de navegación
      var btnPrev = document.getElementById('btn-prev');
      var btnNext = document.getElementById('btn-next');
      var backBtn = document.getElementById('back-btn');
      var currentIndex = 0;

      function showPage(idx) {
        if (idx < 0) idx = 0;
        if (idx >= totalPages) idx = totalPages - 1;
        pageElements.forEach(function(pg, i) {
          pg.classList.toggle('active', i === idx);
        });
        currentIndex = idx;
        indicator.textContent = (currentIndex + 1) + ' de ' + totalPages;
        btnPrev.style.visibility = (currentIndex === 0 ? 'hidden' : 'visible');
        btnNext.style.visibility = (currentIndex === totalPages - 1 ? 'hidden' : 'visible');
      }

      btnPrev.addEventListener('click', function() {
        showPage(currentIndex - 1);
      });
      btnNext.addEventListener('click', function() {
        showPage(currentIndex + 1);
      });
      backBtn.addEventListener('click', function() {
        showPage(0);
      });
    });
  </script>
</body>
</html>
