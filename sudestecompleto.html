<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>sudeste completo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 30px;
      line-height: 1;
      background-color: white;
      color: black;
    }

.barra-superior {
  width: 100%;
  height: 70px;
  background-color: #e0e0e0;   /* gris clásico */
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-sizing: border-box;

  padding: 6px 10px;           /* espacio entre contenido y marco */

  border: 2px solid black;     /* marco interior */
  outline: 2px solid black;    /* marco exterior */
  outline-offset: -4px;        /* líneas juntas estilo Windows antiguo */
}

    /* TÍTULO con marco doble y espacio interno */
    .barra-superior .titulo-seccion {
      flex-grow: 1;
      text-align: center;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .barra-secundaria {
      width: 100%;
      display: flex;
      box-sizing: border-box;
      padding: 0 10px;
      margin-top: 5px;
      border-bottom: 1px solid #ccc;
    }

    .columna-autor {
      width: 45%;
      font-weight: bold;
      text-decoration: underline;
    }

    .columna-titulo {
      width: 55%;
      font-weight: bold;
      text-decoration: underline;
      text-align: right;
    }

    .lista {
      margin-top: 10px;
      padding: 0 10px;
    }

.fila {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;

  /* línea continua tipo renglón */
  border-bottom: 2px dotted black;
}
.fila .articulo {
  width: 60%;
  text-align: right;
  text-decoration: none;
  color: black;              /* letras blancas */
  background-color: white;   /* fondo negro */
  padding: 2px 6px;
}

    .fila .articulo:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="barra-superior">
    <a href="index.html" id="home-btn" title="Inicio">&#8962;</a>
    <div class="titulo-seccion">Viajes por el Sudeste Asiático</div>
  </div>

  <div class="barra-secundaria">
    <div class="columna-autor">Autor:</div>
    <div class="columna-titulo">Artículo:</div>
  </div>

  <div class="lista">
    <div class="fila">
      <div class="autor">Picher.</div>
      <a href="sudeste1.html" class="articulo">I Mis días en Bangkok</a>
    </div>
    <div class="fila">
      <div class="autor">Picher.</div>
      <a href="sudeste2.html" class="articulo">II; Phuket y de vuelta a Bangkok</a>
    </div>
    <div class="fila">
      <div class="autor">Picher.</div>
      <a href="sudeste3.html" class="articulo">III; Templos de Angkor, Camboya</a>
    </div>
    <div class="fila">
      <div class="autor">Picher.</div>
      <a href="sudeste4.html" class="articulo">IV; Phnom Penh, Camboya</a>
    </div>
    <div class="fila">
      <div class="autor">Picher.</div>
      <a href="sudeste5.html" class="articulo">V; Chau Doc, Saigón y Hué</a>
    </div>
    <div class="fila">
      <div class="autor">Picher.</div>
      <a href="sudeste6.html" class="articulo">VI; Hanoi, Bangkok y final</a>
    </div>
  </div>

</body>
</html>
